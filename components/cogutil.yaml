name: cogutil
version: "1.0.0"
type: utility-library
description: "OpenCog utility library providing essential foundation services for cognitive architectures"

# Component location and files
source:
  header: "../ggml/include/ggml-cogutil.h"
  implementation: "../ggml/src/ggml-cogutil.c"

# This is a foundation component with no dependencies
requires: []

# Component interface - what this component provides
provides:
  - cogutil_type_registry_t
  - cogutil_config_t
  - cogutil_string_t
  - cogutil_memory_pool_t
  - cogutil_error_t
  - cogutil_log_level_t

# Core functionality exposed
functions:
  # Type system
  - cogutil_type_registry_init
  - cogutil_type_register
  - cogutil_type_get_by_id
  - cogutil_type_get_by_name
  - cogutil_type_is_subtype
  
  # Configuration management
  - cogutil_config_init
  - cogutil_config_set_string
  - cogutil_config_set_number
  - cogutil_config_set_bool
  - cogutil_config_get_string
  - cogutil_config_get_number
  - cogutil_config_get_bool
  - cogutil_config_load_file
  
  # Logging system
  - cogutil_log_init
  - cogutil_log
  - cogutil_log_location
  - cogutil_log_set_level
  - cogutil_log_get_level
  
  # Memory management
  - cogutil_memory_pool_init
  - cogutil_memory_pool_alloc
  - cogutil_memory_pool_reset
  - cogutil_memory_pool_stats
  
  # String utilities
  - cogutil_string_init
  - cogutil_string_set
  - cogutil_string_append
  - cogutil_string_format
  - cogutil_string_compare
  
  # Validation utilities
  - cogutil_validate_pointer
  - cogutil_validate_string
  - cogutil_validate_bounds
  - cogutil_validate_type_id
  
  # Error handling
  - cogutil_error_message
  - cogutil_is_success
  - cogutil_is_error
  
  # Utility functions
  - cogutil_get_timestamp_ms
  - cogutil_get_timestamp_us
  - cogutil_sleep_ms
  - cogutil_random_range
  - cogutil_hash_string
  - cogutil_safe_strcpy
  - cogutil_safe_strcat

# Build requirements
build:
  cmake_target: ggml-base
  compile_definitions:
    - GGML_USE_COGUTIL
  link_libraries:
    - m
    - pthread

# Testing
tests:
  - test_cogutil_types
  - test_cogutil_config
  - test_cogutil_logging
  - test_cogutil_memory
  - test_cogutil_strings
  - test_cogutil_validation

# Documentation
documentation:
  - "docs/cogutil.md"

# Metadata
tags:
  - utility
  - foundation
  - opencog
  - logging
  - configuration
  - memory-management
  - type-system
  - validation